<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title> Hyper Ego Javascript </title>
<link href="https://fonts.googleapis.com/css2?family=Sixtyfour&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-KQ9PQ4K6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"  integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script><script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js" integrity="sha256-AlTido85uXPlSyyaZNsjJXeCs07eSv3r43kyCVc8ChI="   crossorigin="anonymous"></script>
<script>
   $(function(){
       $('#list').sortable();
	    }); 
	   </script>
<style>
    } body {
        background: whitesmoke;
		width: 1000px;
    } #page {
        width: 1000px;
        height: 1600px;
        background: #000000;
        border: 1px solid dimgray;
    } main {
        width: 768px;
        height: 768px;
        margin: 36px auto;
        display: grid;
        grid-gap: 1px;
        grid-template: repeat(3,256px) / repeat(2,384px);
    } header img {
        width: 100%;
         margin-bottom: 24px;
    } header h1 {
        font: 48pt/1.4em 'Sixtyfour';
        text-align: center;
        margin-top: 24px;
		color: #0074FF
	}header h2 {
		font: 15pt/1.4em 'Basic';
		color: white; 
		text-align: center;
    } #container {
        width: 400px;
        height: 300px;
        background: #000000;
        border-radius: 12px;
        margin: 24px auto;
        font: 14pt/1.4em 'Basic';
        display: grid;
        grid-template: repeat(4, 64px) / auto auto;
    } #list {
        width: 400px;
        height: 300px;
        background: #000000;
        border-radius: 12px;
    } .listitem {
        width: 625px;
        height: 150px;
        background: #FFFFFF;
        border-radius: 12px;
        margin: 2px 0;
        display: flex;
        justify-content: center;
        align-items: center;
    } #numbers {
        width: 80px;
        height: 100px;
        float: left;
    } .number {
        width: 80px;
        height: 150px;
        background: #0074FF;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 12px;
        margin: 2px 0;
    } button {
        width: 150px;
        height: 38px;
        border-radius: 12px;
        background: #0074FF;
        margin:auto;
        display: block;
        font: 12pt/1.4em "Basic";
		align-items: center;

</style>
</head>

<body>
    <div id="page">
        <header>
            <img src="javascriptbanner.png" />
           <h1>Hyper-Ego Fan Vote</h1>
			
			<h2> Please rank the members of ARTMS based on who you 
			think owned the Hyper-Ego era the most! </h2>
        </header>
		
		
		
	
        <main>
			<div id="container">
    <div id="numbers">
        <div class="number">1</div>
        <div class="number">2</div>
        <div class="number">3</div>
        <div class="number">4</div>
    </div>
    <div id="list">
        <div class="listitem">Heejin</div>
        <div class="listitem">Jinsoul</div>
        <div class="listitem">Kim Lip</div>
        <div class="listitem">Choerry</div>
    </div>

			</div>
        </main>
       
       <button onClick="window.print()">Print Page</button>

    </div>
</body>
</html>
